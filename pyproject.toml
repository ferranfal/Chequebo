[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chequebo"
version = "0.6.1"
description = "Linux desktop system monitor with live history and optional recording"
requires-python = ">=3.10"
dependencies = [
  "PyQt6>=6.6,<6.12",
  "PyQt6-WebEngine>=6.6,<6.12",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12,<14"]
dev = ["pytest>=8,<10"]
build = ["nvidia-ml-py>=12,<14"]

[project.scripts]
chequebo = "chequebo.__main__:main"

[tool.setuptools.packages.find]
include = ["chequebo*"]

[tool.setuptools.package-data]
chequebo = ["resources/*.svg", "web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
