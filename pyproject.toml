[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chequebo"
version = "0.2.0"
description = "Linux desktop process monitor with history and peak reports"
requires-python = ">=3.10"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "pyqtgraph>=0.13.7,<0.15",
  "psutil>=6,<8",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12,<14"]
dev = ["pytest>=8,<10"]
build = ["pyinstaller>=6.17,<7"]

[project.scripts]
chequebo = "chequebo.__main__:main"

[tool.setuptools.packages.find]
include = ["chequebo*"]

[tool.setuptools.package-data]
chequebo = ["resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
