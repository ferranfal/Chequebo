name: Ubuntu desktop package
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ubuntu-deb:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 desktop-file-utils
      - run: python -m pip install -e '.[nvidia,dev,build]'
      - run: python -m pytest -q
      - run: desktop-file-validate packaging/io.github.ferranfal.Chequebo.desktop
      - run: ./packaging/build-deb.sh
      - name: Install and smoke-test the desktop package
        run: |
          sudo apt-get install -y ./dist/chequebo_*.deb
          chequebo --version
          chequebo --check-gpu
          chequebo --headless --interval 0.2 --output /tmp/smoke.chequebo -- /usr/bin/python3 -c 'import time; data=bytearray(8*1024*1024); time.sleep(1)'
          timeout --preserve-status -s INT 3s chequebo --headless --interval 0.2 --output /tmp/system-smoke.chequebo
          python -c 'from chequebo.session import load_session; m,s=load_session("/tmp/system-smoke.chequebo"); assert m["scope"] == "system" and m["state"] == "stopped" and len(s) >= 2'
          timeout 5s chequebo || test "$?" = 124
          cd dist
          sha256sum chequebo_*.deb > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: chequebo-ubuntu-amd64
          path: |
            dist/*.deb
            dist/SHA256SUMS
      - name: Attach installer to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.deb dist/SHA256SUMS --clobber
